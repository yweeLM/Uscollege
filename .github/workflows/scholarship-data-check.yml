name: Scholarship Data Check

on:
  schedule:
    - cron: "0 13 * * 1" # every Monday at 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scholarship data check
        run: python3 scripts/check_scholarships.py

      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Scholarship Data Check"
          EXISTING=$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file check-report.md
            echo "Updated issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file check-report.md
          fi
